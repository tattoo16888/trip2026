<body>
<div class="bar"><div><b>照片核對更正版・照片載入修正版</b><small>已修正 iframe 內 lazy-load 導致手機上照片不出現的問題</small></div><a href="./photo-guide.html?v=20260928-direct" target="_blank">直接開原版</a></div>
<iframe id="guide" loading="eager" src="./photo-guide.html?v=20260928-photo-fix2" title="2026日本東北自駕照片導航"></iframe>
<script>
const FIX={
 '御宿東鳳':{name:'御宿東鳳 Onyado Toho',imgs:['https://img.my-best.com/product_images/b709a09efb453e92bfee850495c7e143.jpg?fit=clip&h=800&ixlib=rails-4.3.1&lossless=0&q=70&w=800','https://www.jtb.co.jp/premium/images/stories/2023-1h/4145903_00000000.jpg'],src:'https://toho.orixhotelsandresorts.com/',source:'御宿東鳳官方／旅遊住宿頁'},
 '七日町通り（七日町通）':{name:'七日町通り（七日町通）',imgs:['https://travel.rakuten.co.jp/mytrip/sites/mytrip/files/styles/1cal_image/public/2026-01/fukushima-nanukamachi-guide_55.jpg?itok=ja3t3jX9','https://stat.ameba.jp/user_images/20250518/07/kame-tama1997/87/73/j/o1080081015597749227.jpg'],src:'https://travel.rakuten.co.jp/mytrip/howto/fukushima-nanukamachi-guide',source:'楽天トラベル 七日町通り介紹'},
 'York Benimaru 城西町店':{name:'ヨークベニマル 城西町店（York Benimaru 城西町店・超級市場）',imgs:['https://spacelab-system.jp/upload/facility/8458/1/%E3%83%A8%E3%83%BC%E3%82%AF%E3%83%99%E3%83%8B%E3%83%9E%E3%83%AB%E5%9F%8E%E8%A5%BF%E7%94%BA.png'],src:'https://spacelab-system.jp/facility/8458',source:'城西町店設施頁'},
 'YuiLocalZao':{name:'YuiLocalZao',imgs:['https://dom.jtb.co.jp/yado/photo2/XL/2/2447A28/2447A284000000003.jpg','https://travel.rakuten.co.jp/mytrip/sites/mytrip/files/styles/1cal_image/public/2026-02/news-202602-yuilocalzao-06.jpg?itok=YSoWJMF_'],src:'https://www.jtb.co.jp/kokunai-hotel/htl/2447A28/',source:'JTB YuiLocalZao住宿頁'},
 '蔵王温泉街（藏王溫泉街）':{name:'蔵王温泉街（藏王溫泉街）',imgs:['https://sp.jorudan.co.jp/onsen/images/spot/640/669_4.jpg'],src:'https://sp.jorudan.co.jp/onsen/details/669/',source:'ジョルダン 藏王溫泉介紹'},
 'Hotel B4T Kakunodate':{name:'Hotel B4T Kakunodate（角館B4T酒店）',imgs:['https://trvimg.r10s.jp/share/HOTEL/1720/1720.jpg','https://cdn-ak.f.st-hatena.com/images/fotolife/h/hondamasahiro/20260321/20260321181432.jpg'],src:'https://www.tour.ne.jp/j_hotel/9558/',source:'住宿頁／旅人實拍'},
 '角館武家屋敷通り（角館武家屋敷通）':{name:'角館武家屋敷通り（角館武家屋敷通）',imgs:['https://www.driveconsultant.jp/assets/img/spot/05/0001-2.jpg?size=medium'],src:'https://www.driveconsultant.jp/detail/spot/279.html',source:'Drive Consultant 角館介紹'},
 'ホテル十和田荘（十和田莊）':{name:'ホテル十和田荘（十和田莊）',imgs:['https://pimg.1px.tw/immegumi/1583218986-4095048213.jpg','https://livedoor.blogimg.jp/moya_sic/imgs/7/c/7c582763.jpg'],src:'https://immegumi.pixnet.net/blog/posts/8229033100',source:'旅人住宿實拍'},
 '子ノ口（子之口）':{name:'子ノ口（子之口）',imgs:['https://cdn-ak.f.st-hatena.com/images/fotolife/m/mochikichi-blog/20230819/20230819224211.jpg','https://rimage.gnst.jp/livejapan.com/public/article/detail/a/30/00/a3000124/img/ja/a3000124_parts_5f61e97352bf2.jpg?20201211183219=&q=80'],src:'https://www.mochikichi.net/entry/2023/08/01/000000',source:'旅人奧入瀨實拍'},
 '銚子大滝（銚子大瀑布）':{name:'銚子大滝（銚子大瀑布）',imgs:['https://cdn.yamap.co.jp/public/image2.yamap.co.jp/production/44ccb442-da97-4c67-867f-52e10f6baca9?h=1080&t=resize&w=1914','https://travel.rakuten.com/contents/sites/contents/files/styles/max_1300x1300/public/2025-06/oirase-gorge_9.jpg?itok=MhTbM9zv'],src:'https://yamap.com/activities/24395324',source:'YAMAP／Rakuten Travel 實景'},
 '雲井の滝（雲井瀑布）':{name:'雲井の滝（雲井瀑布）',imgs:['https://cdn.4travel.jp/img/thumbnails/imk/travelogue_pict/82/97/73/650x_82977325.jpg?updated_at=1725003108'],src:'https://4travel.jp/travelogue/11925896',source:'4travel 旅人實拍'},
 '阿修羅の流れ（阿修羅之流）':{name:'阿修羅の流れ（阿修羅之流）',imgs:['https://image.ganref.jp/photos/members/ondeco/MDAwMDA0ODAyOA_MC41OTY4MjAwMCAxNjU1NTY0MzI3_NzcyOTgz_3.jpg'],src:'https://ganref.jp/m/ondeco/portfolios/photo_detail/4922705',source:'GANREF 攝影作品'},
 '石ヶ戸（石戶）':{name:'石ヶ戸（石戶）',imgs:['https://www.jre-travel.com/content/dam/jretravel/site/page/article/images/00220/a00220_08_p.jpg','https://img-cdn.jg.jugem.jp/a46/102630/20181107_2470543.jpg'],src:'https://www.jre-travel.com/article/00220/',source:'JR東日本 びゅうトラベル'}
};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function keyFor(text){
 if(text.includes('York Benimaru 城西町店')) return 'York Benimaru 城西町店';
 if(text.includes('YuiLocalZao')) return 'YuiLocalZao';
 if(text.includes('Hotel B4T Kakunodate')) return 'Hotel B4T Kakunodate';
 if(text.includes('御宿東鳳')) return '御宿東鳳';
 if(text.includes('七日町通り（七日町通）')) return '七日町通り（七日町通）';
 return Object.keys(FIX).find(k=>text.includes(k));
}
function forceAllImages(d){
 d.querySelectorAll('img').forEach(img=>{
   img.loading='eager'; img.decoding='async'; img.referrerPolicy='no-referrer'; img.style.display='block';
   if(img.complete && img.naturalWidth===0){ const s=img.getAttribute('src'); if(s){img.removeAttribute('src'); requestAnimationFrame(()=>img.setAttribute('src',s));} }
 });
}
function putVerified(row,x,d){
 const old=row.querySelector('.photo'); if(old)old.remove();
 const box=d.createElement('div'); box.className='photo';
 const a=d.createElement('a'); a.href=x.src; a.target='_blank'; a.rel='noopener';
 const img=d.createElement('img'); img.alt=x.name; img.loading='eager'; img.decoding='async'; img.referrerPolicy='no-referrer'; img.src=x.imgs[0]; img.style.display='block';
 let idx=0; img.onerror=()=>{idx++; if(idx<x.imgs.length){img.src=x.imgs[idx]}else{img.style.display='none'; const f=d.createElement('div');f.className='fallback';f.textContent='照片來源暫時無法載入，可按 Google Maps 看現場照片。';box.prepend(f)}};
 a.appendChild(img); box.appendChild(a);
 const cap=d.createElement('div');cap.className='pcap';cap.innerHTML=`<b>📷 ${esc(x.name)}</b><span style="display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#e7f2ec;color:#245346;font-size:.7rem;font-weight:800">已逐一核對</span><div style="font-size:.7rem;color:#6b746f;margin-top:3px">照片來源：${esc(x.source)}｜點照片看來源頁</div>`;box.appendChild(cap);
 const map=row.querySelector('a.map'); if(map)row.insertBefore(box,map); else row.appendChild(box);
}
function patch(){
 const f=document.getElementById('guide'), d=f.contentDocument; if(!d)return;
 forceAllImages(d);
 [...d.querySelectorAll('.row')].forEach(row=>{
   const p=row.querySelector('.place'); if(!p)return;
   const text=p.textContent.trim(); const k=keyFor(text); if(!k)return;
   if(text.startsWith('前往')||text.includes('→'))return;
   if(k==='York Benimaru 城西町店'){
      p.textContent='York Benimaru 城西町店（超級市場）';
      const desc=row.querySelector('.desc');if(desc)desc.textContent='水果、牛奶、優格、飯糰、小孩食品';
   }
   putVerified(row,FIX[k],d);
 });
 [...d.querySelectorAll('.day')].forEach(day=>{
   const h=day.querySelector('h3');if(!h||!h.textContent.includes('10/6'))return;
   if(day.querySelector('.oirase-verified'))return;
   const body=day.querySelector('.daybody');if(!body)return;
   const n=d.createElement('div');n.className='warn oirase-verified';n.style.background='#edf6f1';n.style.borderLeftColor='#295b50';n.innerHTML='<b>📷 奧入瀨照片已逐站核對：</b>子之口、銚子大瀑布、雲井瀑布、阿修羅之流、石戶皆使用各地點自己的照片。';body.insertBefore(n,body.firstChild);
 });
 forceAllImages(d);
}
const frame=document.getElementById('guide');
frame.addEventListener('load',()=>{patch();setTimeout(patch,300);setTimeout(patch,1200);setTimeout(patch,3000)});
window.addEventListener('pageshow',()=>setTimeout(patch,500));
</script>
</body>
</html>
